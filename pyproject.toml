[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "team-agents"
version = "0.1.0"
description = "Corporate agent overlay system for Codex."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "LicenseRef-Corp-Standard-Agents-Preview-1.0"}
authors = [
  {name = "Jay"},
]
keywords = ["agents", "codex", "context", "git", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
team-agents = "team_agents.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
team_agents = ["schemas/*.json"]
